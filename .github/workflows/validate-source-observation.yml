name: Validate source observation schema

on:
  push:
    paths:
      - "schemas/**"
      - "tests/**"
      - "src/**"
      - "pyproject.toml"
      - "docs/LOCAL_LEDGER.md"
      - "templates/**"
      - "blueprints/**"
      - "training/**"
      - "*.md"
      - "requirements-dev.txt"
      - ".github/workflows/validate-source-observation.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "tests/**"
      - "src/**"
      - "pyproject.toml"
      - "docs/LOCAL_LEDGER.md"
      - "templates/**"
      - "blueprints/**"
      - "training/**"
      - "*.md"
      - "requirements-dev.txt"
      - ".github/workflows/validate-source-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-fixtures:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js for cross-language vectors
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Install project
        run: python -m pip install -e .
      - name: Validate schema and fixtures
        run: python tests/test_source_observation_schema.py
      - name: Test local ledger
        run: python -m unittest discover -s tests -p 'test_local_ledger.py' -v
      - name: Validate journalist templates
        run: python -m unittest discover -s tests -p 'test_templates.py' -v
      - name: Test Merkle checkpoints
        run: python -m unittest discover -s tests -p 'test_checkpoint*.py' -v
      - name: Test v0.2 transparency log
        run: python -m unittest discover -s tests -p 'test_transparency_v2.py' -v
      - name: Verify language-neutral Merkle vectors with JavaScript
        run: |
          node tests/reference/verify_merkle_vectors.js
          node tests/reference/verify_transparency_v2_vectors.js
