[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ojek-local-ledger"
version = "0.1.0"
description = "Local-first metadata ledger for the Open Journalism Evidence Kit"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
ojek = "ojek_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ojek-local-ledger/schemas" = [\n  "schemas/source-observation.v0.1.schema.json",\n  "schemas/transparency-log-entry.v0.2.schema.json",\n  "schemas/transparency-tree-head.v0.2.schema.json",\n  "schemas/transparency-consistency-proof.v0.2.schema.json",\n]
